<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Popup con Movimiento y Control</title>
  <style>
    body {
      margin: 0;
      overflow: hidden; /* evita scrolls */
    }

    #popup {
      background-color: rgba(125,204,246,1);
      width: 300px;
      height: 200px;
      border-radius: 5px;
      position: fixed;
      padding: 2px;
      display: block;
      z-index: 1000;
    }

    #popup-header {
      width: 100%;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: move;
    }

    svg:hover path {
      stroke: gray;
    }

    #reabrir-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 999;
      padding: 5px 10px;
      background-color: #ddd;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: Arial;
    }
  </style>
</head>
<body>

  <button id="reabrir-btn" style="display: none;">Reabrir Popup</button>

  <div id="popup">
    <div id="popup-header">
      <span style="margin-left: 10px; font-family: Arial; font-size: 11pt;">
        Transferir Receta a Controlador
      </span>
      <div id="cerrar-btn">
        <svg width="26" height="26" style="margin-right: 10px; cursor: pointer;" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(0, 0)">
            <rect x="0" y="2" width="26" height="26" fill="transparent"></rect>
            <path d="M7 9 L19 21 M7 21 L19 9" stroke="black" stroke-width="1" fill="none"/>
          </g>
        </svg>
      </div>
    </div>
    <div style="background-color: rgba(245,245,245,1); width: 100%; height: calc(100% - 30px); position: relative; border-bottom-left-radius: 5px; border-bottom-right-radius: 5px;">
    </div>
  </div>

  <script>
    const popup = document.getElementById("popup");
    const header = document.getElementById("popup-header");
    const cerrarBtn = document.getElementById("cerrar-btn");
    const reabrirBtn = document.getElementById("reabrir-btn");

    let offsetX = 0, offsetY = 0, isDragging = false;

    header.addEventListener("mousedown", (e) => {
      isDragging = true;
      offsetX = e.clientX - popup.offsetLeft;
      offsetY = e.clientY - popup.offsetTop;
    });

    document.addEventListener("mousemove", (e) => {
      if (isDragging) {
        let x = e.clientX - offsetX;
        let y = e.clientY - offsetY;
        popup.style.left = x + "px";
        popup.style.top = y + "px";
      }
    });

    document.addEventListener("mouseup", () => {
      isDragging = false;
    });

    // Click fuera del popup → fondo gris
    document.addEventListener("click", (e) => {
      if (!popup.contains(e.target)) {
        popup.style.backgroundColor = "rgba(145,147,154,1)";
      }
    });

    // Click dentro → fondo celeste
    popup.addEventListener("mousedown", (e) => {
        popup.style.backgroundColor = "rgba(125,204,246,1)";
        e.stopPropagation();
    });

    // Botón cerrar
    cerrarBtn.addEventListener("click", () => {
      popup.style.display = "none";
      reabrirBtn.style.display = "inline-block";
    });

    // Botón reabrir
    reabrirBtn.addEventListener("click", () => {
      popup.style.display = "block";
      reabrirBtn.style.display = "none";
    });
  </script>

</body>
</html>
