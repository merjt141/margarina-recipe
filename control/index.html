<!DOCTYPE html>
<html lang='en'>

<head>
	<meta charset='utf-8'>
	<title>Formulario de Recetas</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
	<script src='./dist/webcc.min.js' type="text/javascript"></script>
	<script src="./dist/jquery-3.6.3.js" type="text/javascript"></script>
    <script src="./dist/jys-recipe-app.js" type="text/javascript"></script>
    <link rel="stylesheet" href="./dist/jys-recipe-app.css">
</head>

<body>
    <header>
        <div style="font-size: 9pt; display: flex;">
            <button class="button-image-top form-select-button" onclick="app.loadContent('formEscoger')">
                <img src="./src/assets/images/icons8-write-64.png" alt="Icon">
                Nueva Receta L1 L3 LKombin
            </button>
            <button class="button-image-top form-select-button" onclick="app.loadContent('formAbrir')">
                <img src="./src/assets/images/folder-files-and-folders-svgrepo-com.png" alt="Icon">
                Abrir Receta L1 L3 LKombin
            </button>
            <button class="button-image-top form-select-button" onclick="app.loadContent('formIngredientes')">
                <img src="./src/assets/images/books-svgrepo-com.png" alt="Icon">
                Ingredientes
            </button>
            <span style="margin-left: auto;"></span>
            <button class="button-image-top banner-option-button" onclick="app.loadAcercaDe()">
                <img src="./src/assets/images/OIP.png" alt="Icon">
                Versión
            </button>
            <button class="button-image-top banner-option-button" onclick=""disabled>
                <img src="./src/assets/images/icons8-exit-door-64.png" alt="Icon">
                Salir
            </button>
        </div>
    </header>
    <main id="main-content" class="main-content" style="width: 1000px;">    
    </main>
</body>
</html>
