<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferir Receta a Controlador</title>
    <link rel="stylesheet" href="../../src/styles/transfer/transfer-style.css">

    <style>

    </style>
</head>
<body class="bg-light">

    <div class="transfer-container">
        <table>
            <tbody>
                <tr>
                    <div style="text-align: center;">
                        <label id="lblEtiqueta">#</label>
                    </div>
                </tr>
                <tr>
                    <div style="text-align: center;">
                        <input type="text" id="recipeCode" disabled>
                    </div>
                </tr>
            </tbody>
        </table>
        <table style="width: 600px; border-spacing: 0px;">
            <tbody>
                <tr class="transfer-content" style="flex-direction: row;">
                    <td>
                        <button id="linea1" onclick="cmdTransferirClick(1)">
                            <img src="../../src/assets/images/computer.png" alt="Icon" class="button-transfer">
                            Linea 1
                        </button>
                    </td>
                    <td>
                        <button id="linea5" onclick="cmdTransferirClick(5)">
                            <img src="../../src/assets/images/computer.png" alt="Icon" class="button-transfer">
                            Linea 2
                        </button>
                    </td>
                    <td>
                        <button id="linea3" onclick="cmdTransferirClick(3)">
                            <img src="../../src/assets/images/computer.png" alt="Icon" class="button-transfer">
                            Linea 3
                        </button>
                    </td>
                    <td>
                        <button id="linea4" onclick="cmdTransferirClick(4)">
                            <img src="../../src/assets/images/computer.png" alt="Icon" class="button-transfer">
                            Linea 4
                        </button>
                    </td>
                    <td>
                        <button id="linea2" onclick="cmdTransferirClick(2)">
                            <img src="../../src/assets/images/computer.png" alt="Icon" class="button-transfer">
                            Linea 5
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
<script>

    function receiveData(data) {
        document.getElementById("lblEtiqueta").textContent = `Transferencia a Planta ${data.copsa ? "COPSA" : "IPSA"}`;
        document.getElementById("recipeCode").value = data.recipe
        document.getElementById("linea1").disabled = data.copsa;
        document.getElementById("linea2").disabled = data.copsa;
        document.getElementById("linea3").disabled = data.copsa;
        document.getElementById("linea4").disabled = !data.copsa;
        document.getElementById("linea5").disabled = !data.copsa;
    }

    function cmdTransferirClick(line) {
        // Mensaje local de confirmación de carga de datos a PLC
        let userConfirmation = confirm(`¿Está seguro de transferir la receta seleccionada a la línea ${line}?`);
        if (!userConfirmation) {
            return;
        }

        // Ejecutar carga de datos a PLC
        window.opener.app.formAbrir.cmdTransferirAction(line);
    }
</script>
</html>
