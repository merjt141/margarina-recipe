<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Popup con Movimiento y Control</title>
    <link
      rel="stylesheet"
      href="../../src/styles/transfer/transfer-style.css"
    />
    <style>
      body {
        margin: 0;
        overflow: hidden; /* evita scrolls */
      }

      #popup {
        background-color: rgba(125, 204, 246, 1);
        width: 560px;
        height: 200px;
        border-radius: 5px;
        position: fixed;
        padding: 2px;
        display: block;
        z-index: 1000;
      }

      #popup-header {
        width: 100%;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: move;
      }

      svg:hover path {
        stroke: gray;
      }

      #reabrir-btn {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 999;
        padding: 5px 10px;
        background-color: #ddd;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-family: Arial;
      }
    </style>
  </head>
  <body>
    <button id="reabrir-btn" style="display: none">Reabrir Popup</button>

    <div id="popup">
      <div id="popup-header">
        <span style="margin-left: 10px; font-family: Arial; font-size: 11pt">
          Transferir Recetas
        </span>
        <div id="cerrar-btn">
          <svg
            width="26"
            height="26"
            style="margin-right: 10px; cursor: pointer"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g transform="translate(0, 0)">
              <rect
                x="0"
                y="2"
                width="26"
                height="26"
                fill="transparent"
              ></rect>
              <path
                d="M7 9 L19 21 M7 21 L19 9"
                stroke="black"
                stroke-width="1"
                fill="none"
              />
            </g>
          </svg>
        </div>
      </div>
      <div
        style="
          background-color: rgba(245, 245, 245, 1);
          width: 100%;
          height: calc(100% - 30px);
          position: relative;
          border-bottom-left-radius: 5px;
          border-bottom-right-radius: 5px;
        "
      >
        <div class="transfer-container">
          <table style="width: 560px; border-spacing: 0px; margin-bottom: 10px; padding-top: 5px;">
            <tbody style="padding: 0px;">
              <tr>
                <td style="width: 440px; border-color: black; padding: 0px;">
                  <table>
                    <tbody>
                      <tr>
                        <div
                          style="
                            text-align: center;
                            height: 30px;
                            align-content: center;
                            font-style: italic;
                          "
                        >
                          <label id="lblEtiqueta"
                            ><b>Transferencia a Planta IPSA</b></label
                          >
                        </div>
                      </tr>
                      <tr style="align-items: center;">
                        <div style="text-align: center; height: 30px">
                          <input
                            type="text"
                            id="recipeCode"
                            disabled
                            value="P. HOJAL 2 Kg."
                            style="width: calc(100% - 20px);"
                          />
                        </div>
                      </tr>
                    </tbody>
                  </table>
                </td>
                <td class="transfer-content" style="flex-direction: row; display: flex;">
                  <button id="linea1" onclick="cmdTransferirClick(1)">
                    <img
                      src="../../src/assets/images/computer.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Cancelar
                  </button>
                </td>
              </tr>
            </tbody>
          </table>

          <table style="width: 560px; border-spacing: 0px">
            <tbody>
              <tr class="transfer-content" style="flex-direction: row;">
                <td>
                  <button id="linea1" onclick="cmdTransferirClick(1)">
                    <img
                      src="../../src/assets/images/computer.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Linea 1
                  </button>
                </td>
                <td>
                  <button id="linea5" onclick="cmdTransferirClick(5)">
                    <img
                      src="../../src/assets/images/computer.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Linea 2
                  </button>
                </td>
                <td>
                  <button id="linea3" onclick="cmdTransferirClick(3)">
                    <img
                      src="../../src/assets/images/computer.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Linea 3
                  </button>
                </td>
                <td>
                  <button id="linea4" onclick="cmdTransferirClick(4)">
                    <img
                      src="../../src/assets/images/computer.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Linea 4
                  </button>
                </td>
                <td>
                  <button id="linea2" onclick="cmdTransferirClick(2)">
                    <img
                      src="../../src/assets/images/computer.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Linea 5
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const popup = document.getElementById("popup");
      const header = document.getElementById("popup-header");
      const cerrarBtn = document.getElementById("cerrar-btn");
      const reabrirBtn = document.getElementById("reabrir-btn");

      let offsetX = 0,
        offsetY = 0,
        isDragging = false;

      header.addEventListener("mousedown", (e) => {
        isDragging = true;
        offsetX = e.clientX - popup.offsetLeft;
        offsetY = e.clientY - popup.offsetTop;
      });

      document.addEventListener("mousemove", (e) => {
        if (isDragging) {
          let x = e.clientX - offsetX;
          let y = e.clientY - offsetY;
          popup.style.left = x + "px";
          popup.style.top = y + "px";
        }
      });

      document.addEventListener("mouseup", () => {
        isDragging = false;
      });

      // Click fuera del popup → fondo gris
      document.addEventListener("click", (e) => {
        if (!popup.contains(e.target)) {
          popup.style.backgroundColor = "rgba(145,147,154,1)";
        }
      });

      // Click dentro → fondo celeste
      popup.addEventListener("mousedown", (e) => {
        popup.style.backgroundColor = "rgba(125,204,246,1)";
        e.stopPropagation();
      });

      // Botón cerrar
      cerrarBtn.addEventListener("click", () => {
        popup.style.display = "none";
        reabrirBtn.style.display = "inline-block";
      });

      // Botón reabrir
      reabrirBtn.addEventListener("click", () => {
        popup.style.display = "block";
        reabrirBtn.style.display = "none";
      });
    </script>
  </body>
</html>
