<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Popup con Movimiento y Control</title>
    <link
      rel="stylesheet"
      href="../../src/styles/transfer/transfer-style.css"
    />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #popup {
        background-color: rgba(145, 147, 154, 1);
        width: 560px;
        height: 240px;
        border-radius: 5px;
        position: fixed;
        padding: 2px;
        display: block;
        z-index: 1000;
      }

      #popup-header {
        width: 100%;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: move;
      }

      svg:hover path {
        stroke: gray;
      }

      #reabrir-btn {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 999;
        padding: 5px 10px;
        background-color: #ddd;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-family: Arial;
      }

          
    .barra-container {
      width: 300px;
      height: 30px;
      background-color: #00bfff; /* celeste */
      border: none;
      position: relative;
      overflow: hidden;
    }

    .barra-fill {
      height: 100%;
      width: 0%;
      display: flex;
      flex-direction: row;
      transition: width 0.2s ease-in-out;
    }

    .barra-fill span {
      flex: 1;
      background-color: rgba(255, 255, 255, 0.3); /* segmento transparente */
      border-right: 1px solid white;
    }

    .barra-fill span:last-child {
      border-right: none;
    }


    progress {
  -webkit-appearance: none;
  appearance: none;
  border: 1px solid black; /* Borde negro */
  border-radius: 0;
  background-color: transparent;
}

progress::-webkit-progress-bar {
  background-color: rgba(245, 245, 245, 1); /* color de fondo celeste claro */
  border-radius: 0;
  border: none;
}

progress::-webkit-progress-value {
  background-color: rgba(125, 204, 246, 1); /* celeste más fuerte */
  border-radius: 0;
}

    </style>
  </head>
  <body>
    <button id="reabrir-btn" style="display: none">Reabrir Popup</button>

    <div id="popup">
      <div id="popup-header">
        <span style="margin-left: 10px; font-family: Arial; font-size: 11pt">
          Transferir Recetas
        </span>
        <div id="cerrar-btn">
          <svg
            width="26"
            height="26"
            style="margin-right: 10px; cursor: pointer"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g transform="translate(0, 0)">
              <rect
                x="0"
                y="2"
                width="26"
                height="26"
                fill="transparent"
              ></rect>
              <path
                d="M7 9 L19 21 M7 21 L19 9"
                stroke="black"
                stroke-width="1"
                fill="none"
              />
            </g>
          </svg>
        </div>
      </div>
      <div
        style="
          background-color: rgba(245, 245, 245, 1);
          width: 100%;
          height: calc(100% - 30px);
          position: relative;
          border-bottom-left-radius: 5px;
          border-bottom-right-radius: 5px;
        "
      >
        <div class="transfer-container">
          <table style="width: 560px; border-spacing: 0px; margin-bottom: 10px; padding-top: 5px;">
            <tbody style="padding: 0px;">
              <tr>
                <td style="width: 440px; border-color: black; padding: 0px;">
                  <table>
                    <tbody>
                      <tr>
                        <div
                          style="
                            text-align: center;
                            height: 30px;
                            align-content: center;
                            font-style: italic;
                          "
                        >
                          <label id="lblEtiqueta"
                            ><b>Transferencia a Planta IPSA</b></label
                          >
                        </div>
                      </tr>
                      <tr style="align-items: center;">
                        <div style="text-align: center; height: 30px">
                          <input
                            type="text"
                            id="recipeCode"
                            disabled
                            value="P. HOJAL 2 Kg."
                            style="width: calc(100% - 20px);"
                          />
                        </div>
                      </tr>
                    </tbody>
                  </table>
                </td>
                <td class="transfer-content" style="flex-direction: row; display: flex; margin-left: 8px;">
                  <button id="linea1">
                    <img
                      src="../../src/assets/images/cancel-svgrepo-com.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Cancelar
                  </button>
                </td>
              </tr>
            </tbody>
          </table>

          <table style="width: 560px; border-spacing: 0px">
            <tbody>
              <tr class="transfer-content" style="flex-direction: row;">
                <td>
                  <button id="linea1" onclick="app.formAbrir.cmdTransferirAction(1)">
                    <img
                      src="../../src/assets/images/computer.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Linea 1
                  </button>
                </td>
                <td>
                  <button id="linea5" onclick="app.formAbrir.cmdTransferirAction(5)">
                    <img
                      src="../../src/assets/images/computer.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Linea 2
                  </button>
                </td>
                <td>
                  <button id="linea3" onclick="app.formAbrir.cmdTransferirAction(3)">
                    <img
                      src="../../src/assets/images/computer.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Linea 3
                  </button>
                </td>
                <td>
                  <button id="linea4" onclick="app.formAbrir.cmdTransferirAction(4)">
                    <img
                      src="../../src/assets/images/computer.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Linea 4
                  </button>
                </td>
                <td>
                  <button id="linea2" onclick="app.formAbrir.cmdTransferirAction(2)">
                    <img
                      src="../../src/assets/images/computer.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Linea 5
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
          <table style="width: 560px; border-spacing: 0px; margin-top: 10px;">
            <tbody>
              <tr>
                <td style="text-align: center;">
                  <progress id="transferProgress" value="0" max="100" style="width: 540px; height: 25px;">
                </progress>
                </td>
              </tr>
              <tr>
                <td style="text-align: center; font-weight: bold;">
                  <span id="transferMsg" style="display: none; padding-top: 5px;">
                    Receta transferida al PLC en 0.102 segundos
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const popup = document.getElementById("popup");
      const header = document.getElementById("popup-header");
      const cerrarBtn = document.getElementById("cerrar-btn");
      const reabrirBtn = document.getElementById("reabrir-btn");

      let offsetX = 0,
        offsetY = 0,
        isDragging = false;

      header.addEventListener("mousedown", (e) => {
        isDragging = true;
        offsetX = e.clientX - popup.offsetLeft;
        offsetY = e.clientY - popup.offsetTop;
      });

      document.addEventListener("mousemove", (e) => {
        if (isDragging) {
          let x = e.clientX - offsetX;
          let y = e.clientY - offsetY;
          popup.style.left = x + "px";
          popup.style.top = y + "px";
        }
      });

      document.addEventListener("mouseup", () => {
        isDragging = false;
      });

      // Click fuera del popup → fondo gris
      document.addEventListener("click", (e) => {
        if (!popup.contains(e.target)) {
          popup.style.backgroundColor = "rgba(145,147,154,1)";
        }
      });

      // Click dentro → fondo celeste
      popup.addEventListener("mousedown", (e) => {
        popup.style.backgroundColor = "rgba(125,204,246,1)";
        e.stopPropagation();
      });

      // Botón cerrar
      cerrarBtn.addEventListener("click", () => {
        popup.style.display = "none";
        reabrirBtn.style.display = "inline-block";
      });

      // Botón reabrir
      reabrirBtn.addEventListener("click", () => {
        popup.style.display = "block";
        reabrirBtn.style.display = "none";
      });
    </script>
  </body>
</html>
