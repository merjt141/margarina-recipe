<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Popup con Movimiento y Control</title>
    <link
      rel="stylesheet"
      href="../../src/styles/transfer/transfer-style.css"
    />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #popup {
        background-color: rgba(145, 147, 154, 1);
        width: 680px;
        height: 130px;
        border-radius: 5px;
        position: fixed;
        padding: 2px;
        display: block;
        z-index: 1000;
      }

      #popup-header {
        width: 100%;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: move;
      }

      svg:hover path {
        stroke: gray;
      }

      #reabrir-btn {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 999;
        padding: 5px 10px;
        background-color: #ddd;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-family: Arial;
      }

      .barra-container {
        width: 300px;
        height: 30px;
        background-color: #00bfff; /* celeste */
        border: none;
        position: relative;
        overflow: hidden;
      }

      .barra-fill {
        height: 100%;
        width: 0%;
        display: flex;
        flex-direction: row;
        transition: width 0.2s ease-in-out;
      }

      .barra-fill span {
        flex: 1;
        background-color: rgba(255, 255, 255, 0.3); /* segmento transparente */
        border-right: 1px solid white;
      }

      .barra-fill span:last-child {
        border-right: none;
      }

      progress {
        -webkit-appearance: none;
        appearance: none;
        border: 1px solid black; /* Borde negro */
        border-radius: 0;
        background-color: transparent;
      }

      progress::-webkit-progress-bar {
        background-color: rgba(
          245,
          245,
          245,
          1
        ); /* color de fondo celeste claro */
        border-radius: 0;
        border: none;
      }

      progress::-webkit-progress-value {
        background-color: rgba(125, 204, 246, 1); /* celeste más fuerte */
        border-radius: 0;
      }
    </style>
  </head>
  <body>
    <button id="reabrir-btn" style="display: none">Reabrir Popup</button>

    <div id="popup">
      <div id="popup-header">
        <span style="margin-left: 10px; font-family: Arial; font-size: 11pt">
          Popup
        </span>
        <div id="cerrar-btn">
          <svg
            width="26"
            height="26"
            style="margin-right: 10px; cursor: pointer"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g transform="translate(0, 0)">
              <rect
                x="0"
                y="2"
                width="26"
                height="26"
                fill="transparent"
              ></rect>
              <path
                d="M7 9 L19 21 M7 21 L19 9"
                stroke="black"
                stroke-width="1"
                fill="none"
              />
            </g>
          </svg>
        </div>
      </div>
      <div
        style="
          background-color: rgba(245, 245, 245, 1);
          width: 100%;
          height: calc(100% - 30px);
          position: relative;
          border-bottom-left-radius: 5px;
          border-bottom-right-radius: 5px;
        "
      >
        <div class="transfer-container">
          <table
            style="
              width: 100%;
              border-spacing: 0px;
              padding: 10px 10px 0px 10px;
            "
          >
            <tbody>
              <tr>
                <td style="font-weight: bold">Nueva Receta</td>
              </tr>
            </tbody>
          </table>
          <table
            style="
              width: 100%;
              border-spacing: 0px;
              margin-bottom: 10px;
              padding: 0px 10px 0px 10px;
            "
          >
            <tbody>
              <tr
                class="transfer-content"
                style="flex-direction: row; align-items: center"
              >
                <td style="width: 120px">
                  <label for="save-as-recipe-name" style="font-weight: bold"
                    >Guardar Como:</label
                  >
                </td>
                <td>
                  <input
                    type="text"
                    id="save-as-recipe-name"
                    style="height: 20px; width: 310px"
                  />
                </td>
                <td>
                  <button id="linea1" onclick="app.formAbrir.cmdComoAction()">
                    <img
                      src="./src/assets/images/check-svgrepo-com.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Aceptar
                  </button>
                </td>
                <td>
                  <button id="transfer-cerrar">
                    <img
                      src="./src/assets/images/cancel-svgrepo-com.png"
                      alt="Icon"
                      class="button-transfer"
                    />
                    Cerrar
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const popup = document.getElementById("popup");
      const header = document.getElementById("popup-header");
      const cerrarBtn = document.getElementById("cerrar-btn");
      const reabrirBtn = document.getElementById("reabrir-btn");

      let offsetX = 0,
        offsetY = 0,
        isDragging = false;

      header.addEventListener("mousedown", (e) => {
        isDragging = true;
        offsetX = e.clientX - popup.offsetLeft;
        offsetY = e.clientY - popup.offsetTop;
      });

      document.addEventListener("mousemove", (e) => {
        if (isDragging) {
          let x = e.clientX - offsetX;
          let y = e.clientY - offsetY;
          popup.style.left = x + "px";
          popup.style.top = y + "px";
        }
      });

      document.addEventListener("mouseup", () => {
        isDragging = false;
      });

      // Click fuera del popup → fondo gris
      document.addEventListener("click", (e) => {
        if (!popup.contains(e.target)) {
          popup.style.backgroundColor = "rgba(145,147,154,1)";
        }
      });

      // Click dentro → fondo celeste
      popup.addEventListener("mousedown", (e) => {
        popup.style.backgroundColor = "rgba(125,204,246,1)";
        e.stopPropagation();
      });

      // Botón cerrar
      cerrarBtn.addEventListener("click", () => {
        popup.style.display = "none";
        reabrirBtn.style.display = "inline-block";
      });

      // Botón reabrir
      reabrirBtn.addEventListener("click", () => {
        popup.style.display = "block";
        reabrirBtn.style.display = "none";
      });
    </script>
  </body>
</html>
